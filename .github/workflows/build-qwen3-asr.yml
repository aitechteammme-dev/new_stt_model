name: build-qwen3-asr-image

on:
  workflow_dispatch:
  push:
    branches: ["feature/qwen3-asr-worker"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (CPU, mocked model)
        run: |
          python -m pip install numpy scipy PyYAML pytest
          python -m pytest tests -q
      - name: Secret scan of build context
        run: |
          if grep -rEIl --exclude-dir=.git --exclude-dir=__pycache__ --exclude-dir=.github '(hf_[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .; then
            echo "possible secret in build context"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR (built-in GITHUB_TOKEN, no stored secrets)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name and tags (never overwrite an existing version tag)
        id: meta
        run: |
          IMG="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMG}:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "${IMG}:${VERSION}" >/dev/null 2>&1; then
            echo "tag ${VERSION} already exists; not overwriting"
          else
            TAGS="${TAGS},${IMG}:${VERSION}"
          fi
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Record image reference and digest
        run: |
          {
            echo "image=${{ steps.meta.outputs.image }}"
            echo "tags=${{ steps.meta.outputs.tags }}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "pinned reference: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
